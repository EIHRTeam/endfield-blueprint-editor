      The font stylesheet is linked at runtime by src/app/fonts.ts from
      assets/fonts/HarmonyOS_Sans_SC/result.css, so its `src:local(...)` fallback can be stripped and the
      shipped cn-font-split chunks stay authoritative. The original embedded the same font as a base64
      @font-face rule in this file's style block; linking it keeps the font off the JS bundle.

      There is no mount element: React renders onto document.body, because the original document's
      children (header, main, dialogs, footer) are the body's own children.
    -->
