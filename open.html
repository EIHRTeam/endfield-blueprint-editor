<h1>终末地蓝图编辑器</h1>
<p><a href="dist/blueprint_editor.html">打开已构建的编辑器</a></p>
<p>首次下载源码后，请先安装依赖并构建：</p>
<pre>python -m pip install -r requirements.txt
python scripts/build.py</pre>
<p>Windows 也可在安装依赖后双击 <code>build.cmd</code>，再使用 <code>start.cmd</code> 打开本地预览。便携版直接打开包内的 <code>blueprint_editor.html</code> 即可。</p>
