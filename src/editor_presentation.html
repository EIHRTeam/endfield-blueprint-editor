<style>
#presentationCanvas{touch-action:none;cursor:grab}#portVisibilityFields summary{cursor:pointer;color:#c9d2da}
#btnGamePreview{background:#d6dedd;color:#233b43;border-color:#d6dedd;font-weight:600}
#presentationDialog{width:min(1660px,calc(100vw - 24px));height:calc(100vh - 28px);max-height:none;padding:0;gap:0;overflow:hidden;border-radius:9px}
.presentation-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid #43515d;flex-shrink:0}.presentation-head h2{font-size:17px;flex:1}.presentation-head select{width:125px}#btnExportPresentation{background:#39768f;border-color:#72bad6}
.presentation-body{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:0;flex:1}.presentation-settings{padding:18px;overflow:auto;background:#252e37;border-right:1px solid #43515d;display:flex;flex-direction:column;gap:16px}.presentation-settings label{display:grid;gap:7px;font-size:12px}.presentation-settings textarea{resize:vertical;min-height:72px;color:inherit;background:#1c2228;border:1px solid #45515d;border-radius:4px;font:inherit;padding:8px;width:100%}.presentation-settings input{width:100%}.presentation-settings input:invalid{border-color:#e98e7b}
.presentation-cover{display:flex;align-items:center;gap:10px;text-align:left;padding:10px}.presentation-cover img{width:62px;height:62px;object-fit:contain}.presentation-cover small{display:block;color:#95cddd;margin-top:6px}.presentation-stage{overflow:auto;padding:20px;background:#151d24;display:flex;align-items:flex-start;justify-content:center}.presentation-stage canvas{width:100%;height:auto;box-shadow:0 6px 26px #0006;display:block}
.presentation-colors{display:flex;gap:7px;flex-wrap:wrap}.presentation-colors button{width:27px;height:27px;padding:0;border:2px solid #56616d;border-radius:50%;background:var(--color)}.presentation-colors button[aria-pressed=true]{outline:2px solid #d4ebee;outline-offset:2px;border-color:#25313a}
#coverPicker{border-top:1px solid #485867;padding-top:12px;display:grid;gap:9px}#coverPicker[hidden]{display:none}.cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;max-height:280px;overflow:auto}.cover-choice{padding:5px;min-width:0;background:#1b252f}.cover-choice img{width:54px;height:54px;object-fit:contain}.cover-choice span{display:block;font-size:10px;line-height:1.35;word-break:break-all}.cover-choice[aria-pressed=true]{border-color:#75c7df;background:#315064}.presentation-auto{border-top:1px solid #485867;padding-top:12px;line-height:1.9;color:#becbd4;font-size:12px}.presentation-foot{padding:10px 18px;border-top:1px solid #43515d;display:flex;align-items:center;gap:12px;flex-shrink:0}.presentation-foot span{flex:1;font-size:11px;color:#aab9c5}#presentationError{color:#ffc2b4}#tagSuggestions{display:flex;gap:5px;flex-wrap:wrap}#tagSuggestions button{font-size:10px;padding:3px 6px}
@media(max-width:1000px){#presentationDialog{width:calc(100vw - 12px);height:calc(100vh - 12px)}.presentation-body{grid-template-columns:240px minmax(0,1fr)}.presentation-settings{padding:12px}.presentation-head{padding:10px;flex-wrap:wrap}.presentation-head h2{font-size:15px}.presentation-stage{padding:10px}}
@media(max-width:700px){.presentation-body{display:flex;flex-direction:column;overflow:auto}.presentation-settings{overflow:visible;border-right:0;border-bottom:1px solid #43515d}.presentation-stage{overflow:visible;flex-shrink:0;order:-1}.presentation-settings{gap:12px}.presentation-head h2{flex-basis:100%}.presentation-foot{flex-wrap:wrap}.presentation-foot span{flex-basis:100%}.cover-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
<dialog id="presentationDialog" aria-labelledby="presentationTitle">
  <div class="presentation-head"><h2 id="presentationTitle">蓝图预览 · 编辑右侧详情</h2><select id="presentationResolution" aria-label="完整预览分辨率"><option value="1920">1920 px 宽</option><option value="2560" selected>2560 px 宽</option><option value="3840">3840 px 宽</option></select><button id="btnExportPresentation">导出完整预览 PNG</button><button id="btnApplyPresentation">应用并返回画布</button></div>
  <div class="presentation-body">
    <div class="presentation-settings">
      <label>蓝图名称<input id="presentationName" maxlength="120" autocomplete="off"></label>
      <label>创作者 ID<input id="presentationCreator" maxlength="40" placeholder="填写要展示的 ID" autocomplete="off"></label>
      <label>标签<input id="presentationTags" placeholder="例如：装备，武陵" autocomplete="off"><span class="muted">用逗号分隔，最多 6 个。</span></label>
      <div id="tagSuggestions" aria-label="原版常用标签"></div>
      <label>蓝图描述（选填）<textarea id="presentationDescription" maxlength="400" placeholder="留空时不占用预览空间"></textarea></label>
      <label>蓝图封面</label><button id="btnChooseCover" class="presentation-cover"><img id="presentationCoverThumb" alt="封面物品"><span><b id="presentationCoverName"></b><small>搜索 / 更换封面图标</small></span></button>
      <div id="coverPicker" hidden><input id="coverSearch" type="search" aria-label="搜索封面图标" placeholder="搜索物品或设备名称 / ID"><select id="coverScope" aria-label="封面图标分类"><option value="all">全部原图</option><option value="device">设备</option><option value="product">物品</option></select><div id="coverResults" class="cover-grid"></div><button id="btnMoreCovers">显示更多</button></div>
      <label>封面图纸底色</label><div id="presentationColors" class="presentation-colors" aria-label="封面图纸底色"></div>
      <div class="presentation-auto"><b>画面取景</b><p class="muted">在左侧预览内滚轮缩放、拖动平移。导出保留当前取景。</p></div>
      <label>缩放 <span id="presentationZoomLabel">100%</span><input id="presentationZoom" type="range" min="100" max="400" step="1" value="100"></label>
      <label>水平位置<input id="presentationPanX" type="range" min="0" max="100" step="0.1" value="50"></label>
      <label>垂直位置<input id="presentationPanY" type="range" min="0" max="100" step="0.1" value="50"></label>
      <button id="btnResetViewport">完整显示布局</button>
      <label class="check"><input id="presentationChangeHints" type="checkbox">显示更换图标角标</label>
      <label>暗管连接示意<select id="presentationConnectionPair"><option value="">不显示连接光带</option></select><span class="muted">在画布中配对暗管后，可选择一对连接随图片导出。</span></label>
      <div class="presentation-auto"><b>随布局自动生成</b><div id="presentationAuto"></div><div class="muted">设备清单按原版顺序排列。物流图标按原版隐藏数量。</div></div>
    </div>
    <div class="presentation-stage"><canvas id="presentationCanvas" aria-label="包含右侧详情的完整蓝图预览"></canvas></div>
  </div>
  <div class="presentation-foot"><span id="presentationMessage">修改会实时预览；应用后随蓝图 JSON 和本机草稿保存。</span><span id="presentationError" role="alert"></span><button id="btnCancelPresentation">取消修改</button></div>
</dialog>
