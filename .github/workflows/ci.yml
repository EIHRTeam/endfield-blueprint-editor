name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install build and test dependencies
        run: |
          python -m pip install -r requirements.txt
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chrome
      - name: Verify original inputs and rebuild
        run: |
          pnpm verify-inputs
          pnpm build
      - name: Browser regression and complete UI workflow
        run: |
          pnpm test
          pnpm smoke
      - name: Verify release packaging
        run: python scripts/package_release.py --no-build --source
