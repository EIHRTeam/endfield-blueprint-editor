name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The acceptance suite bakes the whole sprite set through WebAssembly Python on a shared runner,
    # which is much slower than on a developer machine.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No Python toolchain: sprite baking happens in the browser through Pyodide, and the Pillow
      # wheel is downloaded and checksum-verified by the `postinstall` vendoring step.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies and vendor the Pyodide runtime
        run: pnpm install --frozen-lockfile

      - name: Install the browser used by the acceptance suite
        run: pnpm exec playwright install --with-deps chrome

      - name: Verify the packaged source inputs
        run: pnpm verify:inputs

      # `pnpm build` runs the full gate chain: typecheck, lint, format check, bundle and the
      # deployment-shape checks.
      - name: Typecheck, lint, format check, build and check the deployment shape
        run: pnpm build

      - name: Regression and browser acceptance suites
        run: pnpm test

      - name: Verify release packaging
        run: node scripts/package_release.mjs --no-build --source
